name: date_navigation
description: "Мобильное приложение для поиска равноудалённых мест встречи"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  logger: ^2.4.0

  flutter_map: ^6.1.0

  latlong2: ^0.9.0

  url_launcher: ^6.2.1

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.2.2

  firebase_core: ^3.0.0

  cloud_firestore: ^5.6.12

  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#6D4AFF"

flutter_native_splash:
  color: "#6D4AFF"
  color_dark: "#0F1117"
  android_12:
    color: "#6D4AFF"
    color_dark: "#0F1117"